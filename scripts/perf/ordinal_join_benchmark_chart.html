<style>
  #ordinal-join-comparison {
    display: grid;
    gap: calc(var(--font-size-base, 14px) * 1.1);
    color: var(--foreground);
    font-family: var(--font-sans);
  }
  #ordinal-join-comparison .legend {
    display: flex;
    gap: calc(var(--font-size-base, 14px) * 1.2);
    flex-wrap: wrap;
  }
  #ordinal-join-comparison .legend span {
    display: inline-flex;
    align-items: center;
    gap: calc(var(--font-size-base, 14px) * 0.4);
  }
  #ordinal-join-comparison .swatch {
    width: 12px;
    height: 12px;
    display: inline-block;
  }
  #ordinal-join-comparison .hash { fill: var(--chart-1); background: var(--chart-1); }
  #ordinal-join-comparison .ordinal { fill: var(--chart-2); background: var(--chart-2); }
  #ordinal-join-comparison svg { width: 100%; display: block; }
  #ordinal-join-comparison svg text { fill: var(--foreground); font-family: inherit; }
  #ordinal-join-comparison .annotation { color: var(--muted-foreground); }
</style>
<div id="ordinal-join-comparison">
  <div class="viz-controls">
    <label class="form-label">Workload
      <select class="form-select" id="ordinal-join-case" aria-label="Benchmark workload"></select>
    </label>
    <label class="form-label">Memory measure
      <select class="form-select" id="ordinal-join-memory" aria-label="Memory measurement">
        <option value="retained_query_bytes">Retained membership</option>
        <option value="allocated_p50_bytes">Total allocation per operation</option>
        <option value="peak_membership_bytes">Preparation structures</option>
      </select>
    </label>
  </div>
  <div class="legend" aria-label="Strategies">
    <span><i class="swatch hash"></i>Current hash + adaptive execution</span>
    <span><i class="swatch ordinal"></i>Ordinal merge prototype</span>
  </div>
  <div>
    <h3>Median preparation + search</h3>
    <svg id="ordinal-join-latency" role="img" aria-label="End to end median latency"></svg>
  </div>
  <div>
    <h3 id="ordinal-join-memory-heading">Retained membership</h3>
    <svg id="ordinal-join-memory-chart" role="img" aria-label="Join memory comparison"></svg>
  </div>
  <div class="annotation text-small" id="ordinal-join-detail" aria-live="polite"></div>
</div>
<script id="ordinal-join-data" type="application/json">__SUMMARY_JSON__</script>
<script>
(() => {
  const root = document.getElementById("ordinal-join-comparison");
  const results = JSON.parse(document.getElementById("ordinal-join-data").textContent);
  const caseInput = root.querySelector("#ordinal-join-case");
  const memoryInput = root.querySelector("#ordinal-join-memory");
  const latencySvg = root.querySelector("#ordinal-join-latency");
  const memorySvg = root.querySelector("#ordinal-join-memory-chart");
  const titles = {
    "small-objectid": "10 ObjectId keys · 100k local documents",
    "objectid-100k": "100k ObjectId keys · 1m local documents",
    "objectid-1m": "1m ObjectId keys · 2m local documents",
    "string64-100k": "100k string keys · 64 bytes per key",
    "string256-100k": "100k string keys · 256 bytes per key",
    "sparse-objectid": "10k selected keys · 1m-key foreign dictionary",
    "many-segments": "100k ObjectId keys · 32 segments on each side",
    "low-overlap": "100k ObjectId keys · 10% local overlap"
  };
  const shapes = ["selectiveTop10", "broadTop10", "broadCount"];
  const shapeTitles = {
    selectiveTop10: "Selective top 10",
    broadTop10: "Broad top 10",
    broadCount: "Exact full count"
  };
  const cases = [...new Set(results.map(row => row.case))];
  for (const name of cases) {
    const option = document.createElement("option");
    option.value = name;
    option.textContent = titles[name] || name;
    caseInput.appendChild(option);
  }
  caseInput.value = cases.includes("objectid-1m") ? "objectid-1m" : cases[0];
  const namespace = "http://www.w3.org/2000/svg";
  function element(tag, attrs, text) {
    const node = document.createElementNS(namespace, tag);
    for (const [name, value] of Object.entries(attrs)) node.setAttribute(name, value);
    if (text !== undefined) node.textContent = text;
    return node;
  }
  function bytes(value) {
    if (value >= 1048576) return `${(value / 1048576).toFixed(2)} MiB`;
    return `${(value / 1024).toFixed(1)} KiB`;
  }
  function draw(svg, groups, metric, format) {
    svg.replaceChildren();
    const width = Math.max(240, svg.getBoundingClientRect().width);
    const height = groups.length * 88;
    svg.setAttribute("height", height);
    svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
    const maximum = Math.max(1, ...groups.flatMap(group => group.rows.map(row => row[metric])));
    const plotWidth = width - 104;
    groups.forEach((group, i) => {
      const top = i * 88;
      svg.appendChild(element("text", {x: 0, y: top + 21}, group.label));
      group.rows.forEach((row, j) => {
        const barWidth = Math.max(1, row[metric] / maximum * plotWidth);
        const y = top + 31 + j * 22;
        const bar = element("rect", {
          x: 0, y, width: barWidth, height: 14, class: row.strategy
        });
        bar.appendChild(element("title", {}, `${row.strategy}: ${format(row[metric])}`));
        svg.appendChild(bar);
        svg.appendChild(element("text", {x: barWidth + 7, y: y + 12}, format(row[metric])));
      });
    });
  }
  function render() {
    const selected = results.filter(row => row.case === caseInput.value);
    const groups = shapes.map(shape => ({
      label: shapeTitles[shape],
      rows: ["hash", "ordinal"].map(strategy =>
        selected.find(row => row.shape === shape && row.strategy === strategy))
    })).filter(group => group.rows.every(Boolean));
    draw(latencySvg, groups, "p50_ms", value => `${value.toFixed(1)} ms`);
    const metric = memoryInput.value;
    const label = memoryInput.options[memoryInput.selectedIndex].textContent;
    root.querySelector("#ordinal-join-memory-heading").textContent = label;
    const memoryGroups = metric === "allocated_p50_bytes" ? groups : [groups[0]];
    draw(memorySvg, memoryGroups.map(group => ({
      label: metric === "allocated_p50_bytes" ? group.label : "Prepared membership",
      rows: group.rows
    })), metric, bytes);
    const samples = Math.min(...selected.map(row => row.samples));
    root.querySelector("#ordinal-join-detail").textContent =
      metric === "peak_membership_bytes"
        ? `${samples} measured operations per bar · owned preparation structures; excludes rewrite and allocation overlap`
        : `${samples} measured operations per bar · warm readers · reader memory excluded`;
  }
  function save() {
    render();
    if (window.openai?.setWidgetState) {
      window.openai.setWidgetState({
        modelContent: {workload: caseInput.value, memoryMeasure: memoryInput.value},
        privateContent: null
      }).catch(() => {});
    }
  }
  function restore(state) {
    const content = state?.modelContent;
    if (content && cases.includes(content.workload)) caseInput.value = content.workload;
    if (content && [...memoryInput.options].some(option => option.value === content.memoryMeasure)) {
      memoryInput.value = content.memoryMeasure;
    }
    render();
  }
  caseInput.addEventListener("change", save);
  memoryInput.addEventListener("change", save);
  new ResizeObserver(render).observe(root);
  window.addEventListener("openai:set_globals", event => restore(event.detail?.globals?.widgetState));
  restore(window.openai?.widgetState);
})();
</script>
